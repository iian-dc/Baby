<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cámara Bebé</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}video{width:100%;max-width:380px;border-radius:16px;background:#222}button{width:100%;max-width:380px;height:58px;border-radius:14px;border:0;font-weight:900;font-size:18px;margin-top:12px;background:#22c55e}#code{background:#fff;color:#000;padding:12px;border-radius:12px;max-width:380px;margin:12px auto;font-weight:900;display:none}</style></head><body>
<h3>👶 Cámara Bebé</h3><video id="v" autoplay muted playsinline></video><div id="st">Listo</div><div id="code"></div><button id="btn" onclick="iniciar()">INICIAR CÁMARA</button>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4", authDomain:"menu-digital-12e66.firebaseapp.com", databaseURL:"https://menu-digital-12e66-default-rtdb.firebaseio.com", projectId:"menu-digital-12e66", appId:"1:388372771516:web:516a80aeeecc1ab8f756b9"};
firebase.initializeApp(firebaseConfig); const rdb=firebase.database();
let pc,stream; const salaId="sala_"+Math.random().toString(36).substring(2,6);
async function iniciar(){
 document.getElementById('st').innerText="Pidiendo cámara...";
 stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 document.getElementById('v').srcObject=stream;
 document.getElementById('code').style.display='block'; document.getElementById('code').innerText=salaId;
 document.getElementById('st').innerText="Transmitiendo: "+salaId; document.getElementById('btn').innerText="TRANSMITIENDO...";
 try{await navigator.wakeLock.request('screen');}catch(e){}
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 const ref=rdb.ref('kigo_baby_test/'+salaId);
 pc.onicecandidate=e=>{if(e.candidate) ref.child('caller').push(e.candidate.toJSON());};
 const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await ref.child('offer').set({type:offer.type,sdp:offer.sdp});
 ref.child('answer').on('value',async s=>{const d=s.val(); if(d&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d);}});
 ref.child('answerer').on('child_added',async s=>{await pc.addIceCandidate(new RTCIceCandidate(s.val()));});
}
</script></body></html>
