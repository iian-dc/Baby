<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO BABY - Cámara Bebé</title>
<style>
 body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
 video{width:100%;max-width:400px;border-radius:20px;background:#111;transform:scaleX(-1)}
 button{width:100%;max-width:400px;height:60px;border-radius:15px;border:0;font-weight:900;font-size:18px;margin-top:15px}
.iniciar{background:#22c55e}.detener{background:#ef4444;color:#fff}
 #qr{margin:20px auto;background:#fff;padding:15px;border-radius:15px;width:220px;display:none}
</style>
</head>
<body>
<h2>👶 Cámara Bebé</h2>
<video id="localVideo" autoplay muted playsinline></video>
<div id="status">Listo para iniciar</div>
<button id="btnStart" class="iniciar" onclick="iniciar()">INICIAR CÁMARA</button>
<div id="qr"></div>
<small>Deja este celular conectado a la luz, apuntando al bebé. No lo cierres.</small>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
// PEGA AQUI TU CONFIG DE FIREBASE
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  projectId: "TU_PROJECT_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let localStream, pc;
const salaId = "sala_" + Math.random().toString(36).substring(2,8);
async function iniciar(){
  document.getElementById('status').innerText="Pidiendo permisos...";
  localStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:true});
  document.getElementById('localVideo').srcObject = localStream;

  // Evita que se apague la pantalla
  try{ await navigator.wakeLock.request('screen'); }catch(e){}

  document.getElementById('status').innerText="Transmitiendo en sala: "+salaId;
  document.getElementById('btnStart').innerText="TRANSMITIENDO...";
  document.getElementById('btnStart').className="detener";

  // QR simple con el ID de la sala
  document.getElementById('qr').style.display='block';
  document.getElementById('qr').innerHTML = `<div style="color:#000;font-weight:900">${salaId}</div><small style="color:#000">Este código escribe en el otro celular</small>`;

  pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

  const salaRef = db.collection('kigo_baby').doc(salaId);
  pc.onicecandidate = e => { if(e.candidate) salaRef.collection('caller').add(e.candidate.toJSON()); }

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await salaRef.set({offer: {type:offer.type, sdp:offer.sdp}});

  salaRef.onSnapshot(async snap=>{
    const data=snap.data();
    if(data && data.answer &&!pc.currentRemoteDescription){
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });
  salaRef.collection('answerer').onSnapshot(snap=>{
    snap.docChanges().forEach(async change=>{
      if(change.type==='added'){ await pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); }
    });
  });
}
</script>
</body>
  </html>
