<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABY - Cámara</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}video{width:100%;max-width:380px;border-radius:16px;background:#111}button{width:100%;max-width:380px;height:60px;border-radius:14px;border:0;font-weight:900;font-size:18px;margin-top:12px}.ok{background:#22c55e}#codeBox{margin:15px auto;background:#fff;color:#000;padding:12px;border-radius:12px;max-width:380px;font-weight:900;letter-spacing:1px;display:none}</style>
</head>
<body>
<h3>👶 Cámara Bebé</h3>
<video id="v" autoplay muted playsinline></video>
<div id="st">Toca iniciar y deja el cel conectado</div>
<div id="codeBox"></div>
<button id="btn" class="ok" onclick="iniciar()">INICIAR CÁMARA</button>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4",
  authDomain: "menu-digital-12e66.firebaseapp.com",
  databaseURL: "https://menu-digital-12e66-default-rtdb.firebaseio.com",
  projectId: "menu-digital-12e66",
  storageBucket: "menu-digital-12e66.firebasestorage.app",
  messagingSenderId: "388372771516",
  appId: "1:388372771516:web:516a80aeeecc1ab8f756b9",
  measurementId: "G-SBDX42X17X"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let pc, localStream;
const salaId = "sala_"+Math.random().toString(36).substring(2,7);
async function iniciar(){
  document.getElementById('st').innerText="Activando cámara...";
  localStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:true});
  document.getElementById('v').srcObject=localStream;
  try{ await navigator.wakeLock.request('screen'); }catch(e){}
  document.getElementById('codeBox').style.display='block';
  document.getElementById('codeBox').innerText=salaId;
  document.getElementById('st').innerText="Transmitiendo con código: "+salaId;
  document.getElementById('btn').innerText="TRANSMITIENDO...";

  pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  const ref = db.collection('kigo_baby_test').doc(salaId);
  pc.onicecandidate=e=>{if(e.candidate) ref.collection('caller').add(e.candidate.toJSON());}
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  await ref.set({offer:{type:offer.type,sdp:offer.sdp}, creado:Date.now()});
  ref.onSnapshot(async s=>{const d=s.data(); if(d?.answer &&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}});
  ref.collection('answerer').onSnapshot(s=>{s.docChanges().forEach(async c=>{if(c.type==='added') await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));});});
}
</script>
</body>
</html>
