<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cámara Auto</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:12px}video{width:100%;max-width:380px;border-radius:16px;background:#000}#status{margin:10px;background:#222;padding:10px;border-radius:10px}</style></head>
<body>
<h3>👶 Monitor Bebé</h3>
<video id="v" autoplay muted playsinline></video>
<div id="status">Esperando link...</div>
<div id="code" style="font-weight:900;margin-top:10px"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4", authDomain:"menu-digital-12e66.firebaseapp.com", databaseURL:"https://menu-digital-12e66-default-rtdb.firebaseio.com", projectId:"menu-digital-12e66", appId:"1:388372771516:web:516a80aeeecc1ab8f756b9"};
firebase.initializeApp(firebaseConfig); const rdb=firebase.database();
let pc,stream,wakeLock;
async function iniciar(salaId){
 document.getElementById('code').innerText="Sala: "+salaId; document.getElementById('status').innerText="● REC Transmitiendo - No cierres esta página";
 try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('v').srcObject=stream; }catch(e){document.getElementById('status').innerText="Error permiso cámara: "+e; return;}
 try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 const ref=rdb.ref('kigo_baby_test/'+salaId); pc.onicecandidate=e=>{if(e.candidate) ref.child('caller').push(e.candidate.toJSON());};
 const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await ref.child('offer').set({type:offer.type,sdp:offer.sdp});
 ref.child('answer').on('value',async s=>{const d=s.val(); if(d&&!pc.currentRemoteDescription) await pc.setRemoteDescription(d);});
 ref.child('answerer').on('child_added',async s=>{await pc.addIceCandidate(new RTCIceCandidate(s.val()));});
}
const params=new URLSearchParams(location.search); const auto=params.get('auto');
if(auto){ iniciar(auto.toLowerCase()); }else{ document.getElementById('status').innerText="Abre con?auto=NOMBRE - Ej: bebe-camara-auto.html?auto=casa1"; }
</script></body></html>
